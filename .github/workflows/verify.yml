name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: ${{ matrix.check }} (Python ${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported; see src/book_library/install_defaults.py.
        include:
          - python: '3.12'
            check: macOS source release
            release: true
          - python: '3.15'
            check: macOS Python compatibility
            release: false
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ''
      LIBRARY_OPENAI_ENV: ''
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.lock.txt
      - uses: actions/setup-node@v7.1.0
        if: matrix.release
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Source setup without personal configuration
        if: matrix.release
        # Use setup-python's interpreter; bin/setup prefers the newest on PATH.
        run: python scripts/setup.py --root "$RUNNER_TEMP/Reading Room books" --non-interactive
      - name: Python compatibility environment
        if: ${{ !matrix.release }}
        # Exercise every Python contract without rebuilding the shared frontend.
        run: python -m venv .venv
      - name: Verify the environment Python version
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          import sys
          expected = os.environ['EXPECTED_PYTHON']
          actual = f'{sys.version_info.major}.{sys.version_info.minor}'
          if actual != expected:
              raise SystemExit(f'Expected Python {expected}, but setup created Python {actual}.')
          print(f'Verified Python {actual}')
          PY
      - name: Development dependencies
        run: |
          .venv/bin/python -m pip install -r requirements-dev.lock.txt
          .venv/bin/python -m pip install --no-deps -e .
      - name: Public boundary and documentation
        if: matrix.release
        run: |
          .venv/bin/python scripts/check_public_release.py
          .venv/bin/python scripts/check_docs.py
      - name: Python contracts
        run: .venv/bin/python -m pytest -q
      - name: Frontend contracts
        if: matrix.release
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run types
          git diff --exit-code -- frontend/openapi.json frontend/src/generated/api.d.ts
      - name: Browser workflows
        if: matrix.release
        run: |
          npm --prefix frontend exec -- playwright install chromium
          npm --prefix frontend run test:browser
      - name: Installed source smoke test
        if: matrix.release
        run: .venv/bin/python scripts/clean_install_smoke.py --installed
      - name: Package content checks
        if: matrix.release
        run: |
          .venv/bin/python -m build --sdist --no-isolation
          .venv/bin/python -m build --wheel --no-isolation
          .venv/bin/python scripts/check_public_release.py --archive dist/reading_room_library-0.1.0.tar.gz
          .venv/bin/python scripts/check_public_release.py --archive dist/reading_room_library-0.1.0-py3-none-any.whl
